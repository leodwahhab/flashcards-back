spring:
  application:
    name: flashcards-api
  datasource:
    url: jdbc:${DATABASE_URL:postgresql://localhost:5432/flashcards}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: ${DATABASE_DRIVER:org.postgresql.Driver}
  jpa:
    show-sql: ${SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
  docker:
    compose:
      enabled: ${DOCKER_COMPOSE_ENABLED:false}

# JWT_SECRET (Base64, minimo 32 bytes decodificados) e obrigatorio: sem ele a aplicacao nao sobe.
# Gere com: openssl rand -base64 48
# Propriedades adicionais lidas com valor padrao no codigo (nao precisam constar aqui):
#   app.cors.allowed-origins  lista separada por virgulas (padrao http://localhost:3000,http://localhost:5173)
#   app.docs.public           Swagger/OpenAPI sem autenticacao (padrao true; use false em producao)
#   app.login.max-failures / app.login.window-minutes  limite de falhas de login (padrao 10 em 15 min, por instancia)
jwt:
  secret: ${JWT_SECRET:}
  allow-insecure-default: ${JWT_ALLOW_INSECURE_DEFAULT:false}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  study:
    zone: ${APP_STUDY_ZONE:UTC}
    day-start-hour: ${APP_STUDY_DAY_START_HOUR:4}
  media:
    dir: ${APP_MEDIA_DIR:./data/media}
    max-bytes: ${APP_MEDIA_MAX_BYTES:10485760}
